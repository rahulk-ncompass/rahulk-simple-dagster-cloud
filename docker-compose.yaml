services:
  dagster-code:
    image: 368355641188.dkr.ecr.ap-south-1.amazonaws.com/rahulk-dagster:latest
    container_name: dagster-code
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_MYSQL_HOST: ${DAGSTER_MYSQL_HOST}
      DAGSTER_MYSQL_USERNAME: ${DAGSTER_MYSQL_USERNAME}
      DAGSTER_MYSQL_PASSWORD: ${DAGSTER_MYSQL_PASSWORD}
      DAGSTER_MYSQL_DB: ${DAGSTER_MYSQL_DB}
    volumes:
      - dagster_home:/opt/dagster/dagster_home
    expose:
      - "4000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.socket(); s.connect(('localhost', 4000)); s.close()"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  dagster-webserver:
    image: 368355641188.dkr.ecr.ap-south-1.amazonaws.com/rahulk-dagster:latest
    container_name: dagster-webserver
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_MYSQL_HOST: ${DAGSTER_MYSQL_HOST}
      DAGSTER_MYSQL_USERNAME: ${DAGSTER_MYSQL_USERNAME}
      DAGSTER_MYSQL_PASSWORD: ${DAGSTER_MYSQL_PASSWORD}
      DAGSTER_MYSQL_DB: ${DAGSTER_MYSQL_DB}
    volumes:
      - dagster_home:/opt/dagster/dagster_home
    ports:
      - "3000:3000"
    depends_on:
      dagster-code:
        condition: service_healthy
    command:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -w
      - /opt/dagster/app/workspace.yaml

  dagster-daemon:
    image: 368355641188.dkr.ecr.ap-south-1.amazonaws.com/rahulk-dagster:latest
    container_name: dagster-daemon
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_MYSQL_HOST: ${DAGSTER_MYSQL_HOST}
      DAGSTER_MYSQL_USERNAME: ${DAGSTER_MYSQL_USERNAME}
      DAGSTER_MYSQL_PASSWORD: ${DAGSTER_MYSQL_PASSWORD}
      DAGSTER_MYSQL_DB: ${DAGSTER_MYSQL_DB}
    volumes:
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      dagster-code:
        condition: service_healthy
    command: 
      - dagster-daemon
      - run
      
      
volumes:
  dagster_home: